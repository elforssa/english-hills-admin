name: CRM intake scheduler

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-intake-scheduler
  cancel-in-progress: false

jobs:
  process-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Invoke protected CRM intake worker
        env:
          CRM_INTAKE_SCHEDULER_TOKEN: ${{ secrets.CRM_INTAKE_SCHEDULER_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CRM_INTAKE_SCHEDULER_TOKEN}"
          http_status="$(curl \
            --proto '=https' \
            --tlsv1.2 \
            --silent \
            --show-error \
            --fail \
            --output /dev/null \
            --connect-timeout 10 \
            --max-time 70 \
            --retry 2 \
            --retry-connrefused \
            --retry-delay 5 \
            --retry-max-time 160 \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CRM_INTAKE_SCHEDULER_TOKEN}" \
            'https://admin.english-hills.com/api/cron/crm-intake')"
          case "${http_status}" in
            2??) ;;
            *) echo 'CRM intake scheduler returned a non-2xx status.' >&2; exit 1 ;;
          esac
