name: Verify
on:
  pull_request:
  push:
    branches: [main]
jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify CI routing and documentation checker regressions
        run: python3 scripts/ci/test_verify.py
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci/verify.py classify --base "$BASE" --head "$HEAD"
  docs:
    needs: classify
    if: needs.classify.result == 'success' && needs.classify.outputs.mode == 'docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify changed Markdown links, anchors, added secrets/PII and whitespace
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci/verify.py docs --base "$BASE" --head "$HEAD"
  app:
    needs: classify
    if: always() && (needs.classify.result != 'success' || needs.classify.outputs.mode != 'docs')
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: local-ci-placeholder
      DISABLE_EXTERNAL_EMAIL: 'true'
      NEXT_PUBLIC_SENTRY_DSN: ''
      SENTRY_DSN: ''
      SENTRY_AUTH_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:crm-intake
      - run: npm run test:crm-lifecycle
      - run: npm run test:navigation
      - run: npx playwright install --with-deps chromium
      - run: npm run test:middleware
      - run: npm run lint
      - run: npm run build
      - run: npm run test:audit-policy
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run audit:policy
  local-database:
    needs: classify
    if: always() && github.event_name == 'pull_request' && (needs.classify.result != 'success' || needs.classify.outputs.mode != 'docs')
    runs-on: ubuntu-latest
    env:
      DISABLE_EXTERNAL_EMAIL: 'true'
      NEXT_PUBLIC_SENTRY_DSN: ''
      SENTRY_DSN: ''
      SENTRY_AUTH_TOKEN: ''
      TURNSTILE_SECRET_KEY: ''
      SUPABASE_TELEMETRY_DISABLED: '1'
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: supabase/setup-cli@v2
        with:
          version: 2.116.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: supabase start
      - name: Configure local-only app credentials
        run: |
          supabase status -o env > /tmp/hills-supabase-status.env
          awk -F= '$1 == "API_URL" { print "NEXT_PUBLIC_SUPABASE_URL=" $2 } $1 == "ANON_KEY" { print "NEXT_PUBLIC_SUPABASE_ANON_KEY=" $2 } $1 == "SERVICE_ROLE_KEY" { print "SUPABASE_SERVICE_ROLE_KEY=" $2 }' /tmp/hills-supabase-status.env > .env.local
          rm /tmp/hills-supabase-status.env
          test "$(wc -l < .env.local)" -eq 3
          grep -q '^NEXT_PUBLIC_SUPABASE_URL="http://127.0.0.1:54321"$' .env.local
      - name: Synthetic 097 to current upgrade
        run: |
          supabase db reset --local --version 097 --no-seed
          docker exec -i supabase_db_hills-admin-next psql -U postgres -d postgres -q -v ON_ERROR_STOP=1 < scripts/test-crm-batch2-upgrade-097.sql
          supabase migration up --local
          psql -X -q -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/test-crm-batch2-upgrade-current.sql
          supabase db reset --local --no-seed
      - name: Stateful 100 to revision-4 upgrade
        run: |
          supabase db reset --local --version 100 --no-seed
          docker exec -i supabase_db_hills-admin-next psql -U postgres -d postgres -q -v ON_ERROR_STOP=1 < scripts/test-crm-r4-upgrade-100-setup.sql
          supabase migration up --local
          psql -X -q -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/test-crm-r4-upgrade-100-current.sql
          supabase db reset --local --no-seed
      - name: Closed 102 to advisory 103 upgrade
        run: |
          supabase db reset --local --version 102 --no-seed
          docker exec -i supabase_db_hills-admin-next psql -U postgres -d postgres -q -v ON_ERROR_STOP=1 < scripts/test-crm-r4-upgrade-102-setup.sql
          supabase migration up --local
          psql -X -q -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/test-crm-r4-upgrade-102-current.sql
          supabase db reset --local --no-seed
      - name: Stateful 103 to H3-02 compatibility upgrade
        env:
          PGPASSWORD: postgres
        run: |
          supabase db reset --local --version 103 --no-seed
          psql -X -q -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/test-crm-h3-upgrade-103-setup.sql
          supabase migration up --local
          psql -X -q -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/test-crm-h3-upgrade-103-current.sql
          supabase db reset --local --no-seed
      - name: H3-04 exact provider seed fresh, stateful upgrade, security and dormancy acceptance
        run: npm run test:crm-h3-04-local
      - name: Reconciliation repair fresh, stateful upgrade, concurrency and real HTTP acceptance
        run: npm run test:crm-reconciliation-repair-local
      - name: Rollback-only migration regression
        run: |
          docker exec -i supabase_db_hills-admin-next psql -U postgres -d postgres -q -v ON_ERROR_STOP=1 < scripts/test-audit-remediation.sql
          docker exec -i supabase_db_hills-admin-next psql -U postgres -d postgres -q -v ON_ERROR_STOP=1 < scripts/test-paid-enrollment.sql
          docker exec -i supabase_db_hills-admin-next psql -U postgres -d postgres -q -v ON_ERROR_STOP=1 < scripts/test-student-placement.sql
          docker exec -i supabase_db_hills-admin-next psql -U postgres -d postgres -q -v ON_ERROR_STOP=1 < scripts/test-enrollment-workflow.sql
          docker exec -i supabase_db_hills-admin-next psql -U postgres -d postgres -q -v ON_ERROR_STOP=1 < scripts/test-receptionist-batch1.sql
          docker exec -i supabase_db_hills-admin-next psql -U postgres -d postgres -q -v ON_ERROR_STOP=1 < scripts/test-receptionist-group-filter.sql
          docker exec -i supabase_db_hills-admin-next psql -U postgres -d postgres -q -v ON_ERROR_STOP=1 < scripts/test-crm-phase8.sql
          docker exec -i supabase_db_hills-admin-next psql -U postgres -d postgres -q -v ON_ERROR_STOP=1 < scripts/test-crm-phase9.sql
          docker exec -i supabase_db_hills-admin-next psql -U postgres -d postgres -q -v ON_ERROR_STOP=1 < scripts/test-crm-phase10.sql
          docker exec -i supabase_db_hills-admin-next psql -U postgres -d postgres -q -v ON_ERROR_STOP=1 < scripts/test-crm-phase12-e2e.sql
          psql -X -q -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/test-crm-batch2.sql
          docker exec -i supabase_db_hills-admin-next psql -U postgres -d postgres -q -v ON_ERROR_STOP=1 < scripts/test-crm-batch2-live.sql
          docker exec -i supabase_db_hills-admin-next psql -U postgres -d postgres -q -v ON_ERROR_STOP=1 < scripts/test-crm-meta-funnel-r4.sql
      - name: Advisory D2 scope, safety and retention acceptance
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -q -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/test-crm-r4-advisory.sql
          psql -X -q -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/test-crm-r4-advisory-safety.sql
          psql -X -q -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/test-crm-r4-advisory-retention.sql
          psql -X -q -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/test-crm-r4-advisory-exclusions.sql
          psql -X -q -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/test-crm-r4-advisory-review.sql
      - name: H3-02 strict exported-second acceptance in both D2 modes
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -q -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -v d2_requirement=required -f scripts/test-crm-r4-provider-time.sql
          psql -X -q -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -v d2_requirement=advisory -f scripts/test-crm-r4-provider-time.sql
      - name: Lifecycle concurrency and CRM role matrix
        run: |
          python3 scripts/test-crm-phase10-concurrency.py
          node scripts/test-crm-phase12-security.mjs
      - name: Synthetic database and API role suites
        run: |
          npm run dev -- --hostname 127.0.0.1 --port 3101 > /tmp/hills-next.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3101/login > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3101/login > /dev/null
          node scripts/test-batch3a-security.mjs --app
          node scripts/test-batch4a-security.mjs
          node scripts/test-large-data-local.mjs
          node scripts/test-receptionist-browser.mjs
          npm run test:crm-lifecycle-browser
      - name: CRM revision-4 isolated concurrency
        run: python3 scripts/test-crm-meta-funnel-r4-concurrency.py
      - name: Advisory R4 forced sharing-stop race matrix
        run: python3 scripts/test-crm-r4-advisory-concurrency.py
  required:
    if: always()
    needs: [classify, docs, app, local-database]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require the selected verification path
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ needs.classify.outputs.mode }}
          CLASSIFIER: ${{ needs.classify.result }}
          DOCS: ${{ needs.docs.result }}
          APP: ${{ needs.app.result }}
          DATABASE: ${{ needs.local-database.result }}
        run: python3 scripts/ci/verify.py gate
